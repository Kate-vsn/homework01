[project]
name = "churn-service"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "uvicorn>=0.30",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]