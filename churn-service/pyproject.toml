[project]
name = "churn-service"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "uvicorn>=0.30",
    "psycopg2-binary>=2.9",
    "matplotlib>=3.11.2",
    "skops>=0.16.0",
    "mlflow-skinny>=3.16,<4",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8",
    "pandera>=0.33",
    "pyarrow>=26.0.1",
    "dvc[s3]>=3.67",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
