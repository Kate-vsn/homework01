apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-platform-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: ml.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ml-api-service
            port:
              number: 80
  - host: mlflow.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mlflow-service
            port:
              number: 5000