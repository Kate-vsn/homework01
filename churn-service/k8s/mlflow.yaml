apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.16.0
        imagePullPolicy: IfNotPresent
        command: ["mlflow", "server"]
        args:
          - --backend-store-uri=sqlite:///mlflow.db
          - --default-artifact-root=s3://mlflow
          - --host=0.0.0.0
          - --port=5000
        env:
          - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
            value: "false"
          - name: MLFLOW_ALLOWED_HOSTS
            value: "mlflow.mlops*,mlflow.localhost*,localhost*,127.0.0.1*"
          - name: MLFLOW_CORS_ALLOWED_ORIGINS
            value: "http://mlflow.localhost"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000