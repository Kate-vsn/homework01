name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, kind]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ml-service:latest ./churn-service

      - name: Load image into kind
        run: |
          kind load docker-image ml-service:latest --name kind

      - name: Create or Update K8s Secret
        run: |
          kubectl create secret generic ml-secrets \
            --from-literal=DATABASE_URL="postgresql://user:password@postgres-service:5432/db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f churn-service/k8s/
          kubectl rollout restart deployment/ml-api-deployment
          kubectl rollout status deployment/ml-api-deployment

      - name: Smoke Tests
        run: |
          HEALTH_RES=$(curl -s http://ml.localhost/health)
          echo "Health response: $HEALTH_RES"
          echo "$HEALTH_RES" | grep -q "version" || exit 1
          PRED_RES=$(curl -s -X POST http://ml.localhost/v1/predict \
            -H "Content-Type: application/json" \
            -d '{
              "MedInc": 3.5,
              "HouseAge": 25.0,
              "AveRooms": 5.0,
              "AveBedrms": 1.0,
              "Population": 500.0,
              "AveOccup": 3.0,
              "Latitude": 37.88,
              "Longitude": -122.23
            }')
          echo "Prediction response: $PRED_RES"
          
          REQ_ID=$(echo "$PRED_RES" | grep -o '"request_id":"[^"]*' | grep -o '[^"]*$')
          if [ -z "$REQ_ID" ]; then
            echo "Error: request_id not found in response!"
            exit 1
          fi
          echo "Extracted Request ID: $REQ_ID"

          DB_POD=$(kubectl get pods -l app=postgres -o jsonpath="{.items[0].metadata.name}" 2>/dev/null || echo "")
          
          if [ -n "$DB_POD" ]; then
            echo "Checking database in pod $DB_POD..."
            DB_CHECK=$(kubectl exec $DB_POD -- psql -U user -d db -t -c "SELECT COUNT(*) FROM prediction_logs WHERE request_id = '$REQ_ID';")
            echo "Found rows in DB: $DB_CHECK"
            if [ "$DB_CHECK" -eq 0 ]; then
              echo "Error: request_id $REQ_ID was not found in the database!"
              exit 1
            fi
          else
            echo "Postgres pod not found in cluster, skipping direct DB check (or using SQLite/mock)."
          fi
          
          echo "All smoke tests passed successfully!"