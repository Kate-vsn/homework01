name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: churn_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: cd churn-service && uv sync --frozen

      - name: Run linter
        run: cd churn-service && uv run ruff check .

      - name: Run tests with Postgres
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/churn_test_db
        run: cd churn-service && uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./churn-service
          push: true
          tags: ghcr.io/kate-vsn/churn-service:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1

      - name: Create Secret in Kubernetes
        run: |
          kubectl create secret generic churn-secrets \
            --from-literal=DATABASE_URL=postgresql://postgres:postgres@db:5432/churn_db

      - name: Apply Kubernetes manifests
        run: kubectl apply -f churn-service/k8s/

      - name: Set deployed image tag
        run: |
          IMAGE_TAG="ghcr.io/kate-vsn/churn-service:sha-${{ github.sha }}"
          kubectl set image deployment/churn-api-deployment churn-api=$IMAGE_TAG

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/churn-api-deployment --timeout=120s

      - name: Run Smoke Test
        run: |
          kubectl port-forward svc/churn-api-service 8000:80 &
          sleep 5
          
          curl --fail -s -X POST http://localhost:8000/v1/predict \
            -H "Content-Type: application/json" \
            -d '{
              "MedInc": 3.5,
              "HouseAge": 25.0,
              "AveRooms": 5.0,
              "AveBedrms": 1.0,
              "Population": 1200.0,
              "AveOccup": 3.0,
              "Latitude": 35.6,
              "Longitude": -119.5
            }' | python3 -c "import json, sys; r=json.load(sys.stdin); assert r['prediction'] > 0, r"

      - name: Диагностика
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get secrets,configmap
          kubectl get events --sort-by='.lastTimestamp' | tail -20
          kubectl describe deploy/churn-api-deployment | tail -20
          kubectl logs deploy/churn-api-deployment --tail=50 || true
          kubectl logs deploy/churn-api-deployment --tail=50 --previous || true